<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .zone{
            width:200px;
            height:200px;
            border-radius: 50%;
            border: 2px solid red;
            border-top: 2px solid black;
            display:flex;
            justify-content: center;
            align-items: center;
            animation-name: roat;
            animation-duration: 3s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        .slope{
            
            
            transform: rotate(10deg);
            
        }
        @keyframes roat{
            
            0%{
                transform: translate(0px) rotate(15deg);
            }
            50%{
                transform: translate(650px,115px) rotate(180deg);
            }
            100%{
                transform: translate(1400px,250px) rotate(360deg);
            }
        }
        .bounce{
            width:100px;
            height:100px;
            border-radius: 50%;
            display:flex;
            justify-content: center;
            align-items: center;
            border:3px solid green;
            margin:auto;
            animation-name: steps;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes steps{
            0%{
                transform:translate(0px)
            }
            50%{
                transform:translatey(100px)
            }
            100%{
                transform:translate(0px)
            }
        }
        .heart{
            font-size: 70px;
            animation-name:beat;
            animation-duration: 0.6s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            width:50px;
            height:50px;
        }
        @keyframes beat{
            from{
                transform:scale(0.8)
            }
            to{
                transform: scale(1);
            }
        }
        @keyframes transp{
            from{
                opacity: 0;
            }
            to{
                opacity: 1;
            }
        }
        .bell1{
            font-size: 70px;
            animation-name:transp;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        
         @keyframes notif{
            0%{
                transform: rotate(0deg);
            }
            50%{
                transform: rotate(3deg);
            } 
            100%{
                transform: rotate(-3deg);
            }
        } 
        .bell2{
            font-size: 70px;
            animation-name:notif;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            width:50px;
            height:50px;
        }
        
    </style>
</head>
<body>
    <div class="zone">box</div>
    <br><br><br><br><br><br>
    <hr class="slope">
    <br><br><br><br><br>
    <div class="bounce">ball</div>
        <br><br><br><br><br><br>
        <hr>
    </div>
    <div class="heart"><i class="fa-solid fa-heart" ></i></div><br><br>
    <div class="bell1"><i class="fa-solid fa-bell"></i></div><br><br>
    <div class="bell2"><i class="fa-solid fa-bell"></i></div>
    
</body>
</html>
