<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
        }
        ul{
            display : flex;
            list-style-type:none;
            justify-content: space-evenly;

        }
        header{
            display:flex;
            background-color: #2776F5;
            align-items: center;
            justify-content: space-between;
            width:100%;
        }
        h1{
            width:40%;
        }
        nav{
            width:60%;
        }
        a{
            text-decoration: none;
            font-size: 20px;
            color:aliceblue;
        }
        a:hover{
            color:black;
        }
        section{
            width:100%;
            display:flex;
            justify-content: center;
            align-items: center;
            

        }
        form{
            width:80%;
            padding: 40px;
            background-color: aqua;
        }
        fieldset{
            padding:25px;
            border-radius: 15px;
            border:3px solid black;
        }
        .heading{
            text-align:center;
            width:100%
        }
        p{
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: center;
            width:100%;

        }
        .row{
            display:flex;
            flex-wrap: wrap;
        }
        .box{
            display:flex;
            flex-grow: 1;
            min-width: 250px;
            flex-direction: column;
            margin:10px;
        }
        label{
            font-weight: bold;
            color:blue;
        }
        input{
            padding:15px;
            outline:none;
            border:m2px solid green;
            border-radius: 10px;
        }
    </style>

</head>
<body>
    <header>
        <h1>name</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">about</a></li>
                <li><a href="#">skills</a></li>
                <li><a href="#">projects</a></li>
                <li><a href="#">contact</a></li>
            </ul>
        </nav>
    </header>
    <section>
        <form action="#">
            <h1 class="heading">Contact Me</h1>
            <p>Feel free to contact me for Projects.</p>
            <fieldset>
                <legend>Personal Details</legend>
                <div class="row">
                    <div class="box">
                    <label for="fullname">Full Name</label>
                    <input type="text" placeholder="Enter your Name" id="fullname" name="fullmane" required>
                    </div>
                <div class="box">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Enter your email" id="email" name="email">
                </div>
                <div class="box">
                    <label for="tel">Phone no</label>
                    <input type="tel" placeholder="Enter your phone" id="tel" name="tel">
                </div>
                <div class="box">
                    <label for="website">website</label>
                    <input type="website" placeholder="Enter your website" id="website" name="website">
                </div>
                </div>
            </fieldset>
        </form>
    </section>
</body>
</html>
